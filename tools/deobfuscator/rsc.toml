[profile]
input = "ref/gamepack.jar"

[profile.deob]
enable = true

transformers = [
    "AnnotateObfuscatedNames",
    "ClassLiteral",
    "InvokeSpecial",
    "UniqueRenamer",
    "RedundantGoto",
    "FernflowerException",
]

[profile.remap]
enable = false

[profile.source]
decompile = false
cleanup = false
